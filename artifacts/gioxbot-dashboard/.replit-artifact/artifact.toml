kind = "web"
previewPath = "/"
title = "Gioxbot Command Dashboard"
description = "A polished command-control dashboard for enumerating and managing Gioxbot capabilities across Telegram, Facebook Pages, and Discord, with channel coverage, status tracking, search, and command details."
version = "1.0.0"
id = "artifacts/gioxbot-dashboard"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20856

[services.development]
run = "pnpm --filter @workspace/gioxbot-dashboard run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/gioxbot-dashboard", "run", "build" ]
serve = "static"
publicDir = "artifacts/gioxbot-dashboard/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20856"
BASE_PATH = "/"
